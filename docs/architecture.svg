<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/>
    </marker>
    <marker id="arrowVpn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C4FFF"/>
    </marker>
    <marker id="arrowDns" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E7157B"/>
    </marker>
  </defs>

  <rect width="1500" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="750" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#232F3E">Project 4 — Hybrid Cloud Connectivity with Transit Gateway and Site-to-Site VPN</text>
  <text x="750" y="58" text-anchor="middle" font-size="13" fill="#555555">Transit Gateway hub · segmented route tables · IPsec VPN with BGP (ECMP) · Route 53 Resolver hybrid DNS · optional Network Firewall</text>

  <!-- ===================== Simulated on-premises ===================== -->
  <rect x="30" y="85" width="330" height="545" rx="8" fill="#F7F7F7" stroke="#545B64" stroke-width="2"/>
  <text x="45" y="108" font-size="14" font-weight="bold" fill="#232F3E">Simulated on-premises data center</text>
  <text x="45" y="126" font-size="11" fill="#555">VPC 172.16.0.0/16 · stands in for a real DC</text>

  <rect x="48" y="140" width="294" height="240" rx="5" fill="#EEF7E9" stroke="#3F8624"/>
  <text x="58" y="157" font-size="11" fill="#3F8624">DMZ subnet · 172.16.1.0/24</text>

  <rect x="66" y="170" width="258" height="196" rx="8" fill="#FFFFFF" stroke="#545B64" stroke-width="2"/>
  <text x="195" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">Customer gateway router</text>
  <text x="195" y="212" text-anchor="middle" font-size="11" fill="#444">EC2 · Ubuntu 24.04 · 172.16.1.10 + EIP</text>
  <line x1="80" y1="224" x2="310" y2="224" stroke="#DDD"/>
  <text x="82" y="243" font-size="11" fill="#232F3E">• strongSwan — IKEv2, 2 IPsec tunnels</text>
  <text x="82" y="262" font-size="11" fill="#232F3E">• FRR — BGP ASN 65000, ECMP, filters</text>
  <text x="82" y="281" font-size="11" fill="#232F3E">• advertises 172.16.0.0/16</text>
  <text x="82" y="300" font-size="11" fill="#232F3E">• Unbound DNS — corp.example.internal</text>
  <text x="82" y="319" font-size="11" fill="#232F3E">• forwards aws.example.internal</text>
  <text x="94" y="335" font-size="11" fill="#232F3E">to the Resolver inbound endpoint</text>
  <text x="82" y="354" font-size="11" fill="#232F3E">• source/dest check off (routes LAN)</text>

  <rect x="48" y="400" width="294" height="140" rx="5" fill="#E6F2FA" stroke="#147EBA"/>
  <text x="58" y="417" font-size="11" fill="#147EBA">LAN subnet · 172.16.2.0/24</text>
  <rect x="66" y="430" width="258" height="96" rx="8" fill="#FFFFFF" stroke="#545B64" stroke-width="2"/>
  <text x="195" y="454" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">On-prem client</text>
  <text x="195" y="473" text-anchor="middle" font-size="11" fill="#444">EC2 · 172.16.2.20 · Session Manager</text>
  <text x="195" y="490" text-anchor="middle" font-size="11" fill="#444">dig · curl · traceroute tests</text>
  <text x="195" y="507" text-anchor="middle" font-size="11" fill="#444">route 10.0.0.0/8 → router</text>
  <line x1="195" y1="430" x2="195" y2="370" stroke="#232F3E" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="195" y="565" text-anchor="middle" font-size="11" fill="#555">Hybrid DNS names</text>
  <text x="195" y="584" text-anchor="middle" font-size="11" fill="#232F3E">fileserver.corp.example.internal (on-prem)</text>
  <text x="195" y="603" text-anchor="middle" font-size="11" fill="#232F3E">app.prod.aws.example.internal (AWS)</text>

  <!-- Direct Connect alternative -->
  <rect x="30" y="660" width="330" height="110" rx="8" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="1.6" stroke-dasharray="7,5"/>
  <text x="195" y="686" text-anchor="middle" font-size="13" font-weight="bold" fill="#232F3E">AWS Direct Connect (alternative)</text>
  <text x="195" y="706" text-anchor="middle" font-size="11" fill="#444">Not deployed — compared in the README</text>
  <text x="195" y="726" text-anchor="middle" font-size="11" fill="#444">Dedicated link → DX Gateway → Transit VIF → TGW</text>
  <text x="195" y="746" text-anchor="middle" font-size="11" fill="#444">VPN can stay as an encrypted backup path</text>

  <!-- ===================== VPN tunnels ===================== -->
  <path d="M324,230 C420,230 470,300 538,300" fill="none" stroke="#8C4FFF" stroke-width="2.4" marker-end="url(#arrowVpn)" marker-start="url(#arrowVpn)"/>
  <path d="M324,300 C420,300 470,350 538,350" fill="none" stroke="#8C4FFF" stroke-width="2.4" marker-end="url(#arrowVpn)" marker-start="url(#arrowVpn)"/>
  <text x="440" y="380" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#8C4FFF">Site-to-Site VPN</text>
  <text x="440" y="396" text-anchor="middle" font-size="10" fill="#8C4FFF">IPsec IKEv2 over the internet</text>
  <text x="440" y="412" text-anchor="middle" font-size="10" fill="#8C4FFF">Tunnel 1 · 169.254.10.0/30</text>
  <text x="440" y="426" text-anchor="middle" font-size="10" fill="#8C4FFF">Tunnel 2 · 169.254.11.0/30</text>
  <text x="440" y="442" text-anchor="middle" font-size="10" fill="#8C4FFF">eBGP 65000 ↔ 64512, ECMP</text>

  <!-- DNS flow hint -->
  <path d="M324,318 C560,120 760,120 902,156" fill="none" stroke="#E7157B" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#arrowDns)"/>
  <text x="690" y="200" text-anchor="middle" font-size="10.5" fill="#E7157B">DNS query → Resolver inbound endpoint (via VPN)</text>

  <g transform="translate(100,0)">
  <!-- ===================== AWS Region ===================== -->
  <rect x="425" y="85" width="955" height="790" rx="8" fill="none" stroke="#232F3E" stroke-width="1.6"/>
  <text x="440" y="108" font-size="14" font-weight="bold" fill="#232F3E">AWS Region</text>

  <!-- Transit Gateway -->
  <rect x="445" y="240" width="270" height="380" rx="10" fill="#F3EEFF" stroke="#8C4FFF" stroke-width="2.4"/>
  <text x="580" y="266" text-anchor="middle" font-size="15" font-weight="bold" fill="#232F3E">AWS Transit Gateway</text>
  <text x="580" y="285" text-anchor="middle" font-size="11" fill="#444">ASN 64512 · VPN ECMP · default tables off</text>

  <rect x="460" y="300" width="240" height="66" rx="6" fill="#FFFFFF" stroke="#8C4FFF"/>
  <text x="470" y="319" font-size="12" font-weight="bold" fill="#232F3E">rt-onprem</text>
  <text x="470" y="337" font-size="10.5" fill="#444">associated: VPN attachment</text>
  <text x="470" y="354" font-size="10.5" fill="#444">routes: Shared, Dev, Staging, Prod</text>

  <rect x="460" y="376" width="240" height="66" rx="6" fill="#FFFFFF" stroke="#8C4FFF"/>
  <text x="470" y="395" font-size="12" font-weight="bold" fill="#232F3E">rt-shared</text>
  <text x="470" y="413" font-size="10.5" fill="#444">associated: Shared Services</text>
  <text x="470" y="430" font-size="10.5" fill="#444">routes: Dev, Staging, Prod, on-prem</text>

  <rect x="460" y="452" width="240" height="66" rx="6" fill="#FFFFFF" stroke="#8C4FFF"/>
  <text x="470" y="471" font-size="12" font-weight="bold" fill="#232F3E">rt-nonprod</text>
  <text x="470" y="489" font-size="10.5" fill="#444">associated: Dev, Staging</text>
  <text x="470" y="506" font-size="10.5" fill="#444">routes: Dev, Staging, Shared, on-prem</text>

  <rect x="460" y="528" width="240" height="78" rx="6" fill="#FFF5F5" stroke="#DD344C"/>
  <text x="470" y="547" font-size="12" font-weight="bold" fill="#232F3E">rt-prod</text>
  <text x="470" y="565" font-size="10.5" fill="#444">associated: Prod</text>
  <text x="470" y="582" font-size="10.5" fill="#444">routes: Shared, on-prem only</text>
  <text x="470" y="598" font-size="10.5" font-weight="bold" fill="#DD344C">no route to Dev / Staging</text>

  <!-- ===================== VPCs ===================== -->
  <!-- Shared services -->
  <rect x="790" y="100" width="380" height="190" rx="8" fill="#FFFFFF" stroke="#147EBA" stroke-width="2"/>
  <text x="805" y="122" font-size="13" font-weight="bold" fill="#232F3E">Shared Services VPC · 10.0.0.0/16</text>
  <rect x="805" y="134" width="350" height="44" rx="6" fill="#FCE8F0" stroke="#E7157B"/>
  <text x="815" y="152" font-size="11.5" font-weight="bold" fill="#232F3E">Route 53 Resolver inbound endpoint</text>
  <text x="815" y="169" font-size="10.5" fill="#444">10.0.1.10 · 10.0.2.10 — on-prem asks AWS names here</text>
  <rect x="805" y="186" width="350" height="44" rx="6" fill="#FCE8F0" stroke="#E7157B"/>
  <text x="815" y="204" font-size="11.5" font-weight="bold" fill="#232F3E">Resolver outbound endpoint + forwarding rule</text>
  <text x="815" y="221" font-size="10.5" fill="#444">corp.example.internal → 172.16.1.10 (rule shared to all VPCs)</text>
  <rect x="805" y="238" width="350" height="40" rx="6" fill="#FCE8F0" stroke="#E7157B"/>
  <text x="815" y="255" font-size="11.5" font-weight="bold" fill="#232F3E">Private hosted zone aws.example.internal</text>
  <text x="815" y="271" font-size="10.5" fill="#444">associated with all four VPCs</text>

  <!-- Dev -->
  <rect x="790" y="310" width="380" height="88" rx="8" fill="#FFFFFF" stroke="#147EBA" stroke-width="2"/>
  <text x="805" y="332" font-size="13" font-weight="bold" fill="#232F3E">Dev VPC · 10.10.0.0/16</text>
  <rect x="805" y="342" width="350" height="44" rx="6" fill="#FFF4E5" stroke="#ED7100"/>
  <text x="815" y="360" font-size="11.5" font-weight="bold" fill="#232F3E">Test workload · 10.10.1.10</text>
  <text x="815" y="377" font-size="10.5" fill="#444">app.dev.aws.example.internal · no internet access</text>

  <!-- Staging -->
  <rect x="790" y="418" width="380" height="88" rx="8" fill="#FFFFFF" stroke="#147EBA" stroke-width="2"/>
  <text x="805" y="440" font-size="13" font-weight="bold" fill="#232F3E">Staging VPC · 10.20.0.0/16</text>
  <rect x="805" y="450" width="350" height="44" rx="6" fill="#FFF4E5" stroke="#ED7100"/>
  <text x="815" y="468" font-size="11.5" font-weight="bold" fill="#232F3E">Test workload · 10.20.1.10</text>
  <text x="815" y="485" font-size="10.5" fill="#444">app.staging.aws.example.internal · no internet access</text>

  <!-- Prod -->
  <rect x="790" y="526" width="380" height="88" rx="8" fill="#FFFFFF" stroke="#DD344C" stroke-width="2"/>
  <text x="805" y="548" font-size="13" font-weight="bold" fill="#232F3E">Prod VPC · 10.30.0.0/16</text>
  <rect x="805" y="558" width="350" height="44" rx="6" fill="#FFF4E5" stroke="#ED7100"/>
  <text x="815" y="576" font-size="11.5" font-weight="bold" fill="#232F3E">Test workload · 10.30.1.10</text>
  <text x="815" y="593" font-size="10.5" fill="#444">app.prod.aws.example.internal · isolated from non-prod</text>

  <!-- Inspection (optional) -->
  <rect x="790" y="640" width="380" height="110" rx="8" fill="#FFFFFF" stroke="#DD344C" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="805" y="662" font-size="13" font-weight="bold" fill="#232F3E">Inspection VPC · 10.100.0.0/16 (optional)</text>
  <text x="805" y="684" font-size="11" fill="#444">AWS Network Firewall · TGW appliance mode on</text>
  <text x="805" y="703" font-size="11" fill="#444">Spoke route tables send traffic here when enabled</text>
  <text x="805" y="722" font-size="11" fill="#444">Stateful rules drop non-prod ↔ prod, log to CloudWatch</text>
  <text x="805" y="741" font-size="11" fill="#444">EnableNetworkFirewall = true (extra cost)</text>

  <!-- TGW attachments -->
  <line x1="715" y1="300" x2="786" y2="195" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="715" y1="390" x2="786" y2="354" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="715" y1="470" x2="786" y2="462" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="715" y1="567" x2="786" y2="570" stroke="#232F3E" stroke-width="1.8" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="680" y1="620" x2="786" y2="695" stroke="#DD344C" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>


  <!-- ===================== Management column ===================== -->
  <rect x="1190" y="100" width="175" height="100" rx="8" fill="#FCE8F0" stroke="#E7157B" stroke-width="2"/>
  <text x="1277" y="128" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#232F3E">AWS RAM</text>
  <text x="1277" y="148" text-anchor="middle" font-size="10.5" fill="#444">Share TGW and</text>
  <text x="1277" y="164" text-anchor="middle" font-size="10.5" fill="#444">resolver rule with other</text>
  <text x="1277" y="180" text-anchor="middle" font-size="10.5" fill="#444">accounts (optional)</text>

  <rect x="1190" y="220" width="175" height="100" rx="8" fill="#FCE8F0" stroke="#E7157B" stroke-width="2"/>
  <text x="1277" y="248" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#232F3E">CloudWatch + SNS</text>
  <text x="1277" y="268" text-anchor="middle" font-size="10.5" fill="#444">TunnelState alarms:</text>
  <text x="1277" y="284" text-anchor="middle" font-size="10.5" fill="#444">redundancy lost /</text>
  <text x="1277" y="300" text-anchor="middle" font-size="10.5" fill="#444">all tunnels down</text>

  <rect x="1190" y="340" width="175" height="100" rx="8" fill="#FCE8F0" stroke="#E7157B" stroke-width="2"/>
  <text x="1277" y="368" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#232F3E">Network tools</text>
  <text x="1277" y="388" text-anchor="middle" font-size="10.5" fill="#444">Reachability Analyzer</text>
  <text x="1277" y="404" text-anchor="middle" font-size="10.5" fill="#444">TGW Route Analyzer</text>
  <text x="1277" y="420" text-anchor="middle" font-size="10.5" fill="#444">(Network Manager)</text>

  <rect x="1190" y="460" width="175" height="100" rx="8" fill="#FCE8F0" stroke="#E7157B" stroke-width="2"/>
  <text x="1277" y="488" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#232F3E">CloudTrail + Config</text>
  <text x="1277" y="508" text-anchor="middle" font-size="10.5" fill="#444">Audit who changed</text>
  <text x="1277" y="524" text-anchor="middle" font-size="10.5" fill="#444">routes, attachments</text>
  <text x="1277" y="540" text-anchor="middle" font-size="10.5" fill="#444">and VPN settings</text>

  <rect x="1190" y="580" width="175" height="100" rx="8" fill="#FCE8F0" stroke="#E7157B" stroke-width="2"/>
  <text x="1277" y="608" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#232F3E">Systems Manager</text>
  <text x="1277" y="628" text-anchor="middle" font-size="10.5" fill="#444">Session Manager to the</text>
  <text x="1277" y="644" text-anchor="middle" font-size="10.5" fill="#444">router and client —</text>
  <text x="1277" y="660" text-anchor="middle" font-size="10.5" fill="#444">no SSH keys</text>

  <!-- Segmentation summary -->
  <rect x="445" y="645" width="320" height="210" rx="8" fill="#FAFAFA" stroke="#BBBBBB"/>
  <text x="460" y="668" font-size="12.5" font-weight="bold" fill="#232F3E">Who can talk to whom</text>
  <circle cx="466" cy="686" r="5" fill="#1D8102"/>
  <text x="478" y="690" font-size="11" fill="#1D8102"><tspan font-weight="bold">Allowed:</tspan> On-prem ↔ Shared, Dev, Staging, Prod</text>
  <circle cx="466" cy="706" r="5" fill="#1D8102"/>
  <text x="478" y="710" font-size="11" fill="#1D8102"><tspan font-weight="bold">Allowed:</tspan> Dev ↔ Staging</text>
  <circle cx="466" cy="726" r="5" fill="#1D8102"/>
  <text x="478" y="730" font-size="11" fill="#1D8102"><tspan font-weight="bold">Allowed:</tspan> Every VPC ↔ Shared Services</text>
  <circle cx="466" cy="746" r="5" fill="#D13212"/>
  <text x="478" y="750" font-size="11" fill="#D13212"><tspan font-weight="bold">Blocked:</tspan> Dev / Staging ↔ Prod</text>
  <line x1="460" y1="764" x2="750" y2="764" stroke="#DDD"/>
  <line x1="460" y1="782" x2="500" y2="782" stroke="#8C4FFF" stroke-width="2.4"/>
  <text x="508" y="786" font-size="10.5" fill="#232F3E">IPsec tunnel (BGP inside)</text>
  <line x1="460" y1="802" x2="500" y2="802" stroke="#232F3E" stroke-width="1.8"/>
  <text x="508" y="806" font-size="10.5" fill="#232F3E">TGW attachment</text>
  <line x1="460" y1="822" x2="500" y2="822" stroke="#E7157B" stroke-width="1.6" stroke-dasharray="4,4"/>
  <text x="508" y="826" font-size="10.5" fill="#232F3E">DNS query path</text>
  <rect x="460" y="836" width="40" height="12" rx="3" fill="none" stroke="#555" stroke-dasharray="5,4"/>
  <text x="508" y="846" font-size="10.5" fill="#232F3E">Optional / not deployed</text>
  </g>
</svg>
